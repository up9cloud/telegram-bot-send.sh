on:
  push:
    tags:
      - v*
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # v1.0.1 shipped with VERSION=1.1.0; refuse a tag that disagrees with tg.ash
      - run: test "v$(sed -n 's/^VERSION=//p' tg.ash)" = "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" tg.ash --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  # sstc/notify bundles the latest release's tg.ash
  rebuild-notify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run notify.yml --repo docker-sstc/mono --ref master
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
